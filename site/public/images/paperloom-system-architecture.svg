<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">PaperLoom current research runtime</title>
  <desc id="description">The live PaperLoom turn from Folio through Java-owned scope, conversation and generation controls; Redis Streams dispatch; the Python Agents SDK runtime and deterministic answer protocol; and the Java Corpus API backed by MySQL and Qdrant.</desc>
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66766f"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1.4" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#66766f"/>
    </marker>
    <style>
      .canvas { fill: #f7f8f5; }
      .boundary-experience { fill: #f1f3f1; stroke: #b7c1be; stroke-width: 1.5; }
      .boundary-java { fill: #eef2f8; stroke: #aebed8; stroke-width: 1.5; }
      .boundary-dispatch { fill: #fbf8ef; stroke: #d8c7a7; stroke-width: 1.5; }
      .boundary-python { fill: #edf5f1; stroke: #afc8bc; stroke-width: 1.5; }
      .node-dark { fill: #18212b; stroke: #18212b; stroke-width: 2; }
      .node-blue { fill: #e8eef9; stroke: #2356d8; stroke-width: 2.3; }
      .node-green { fill: #e7f1ec; stroke: #327a63; stroke-width: 2.3; }
      .node-gold { fill: #fff7e7; stroke: #b6781f; stroke-width: 2.3; }
      .node-red { fill: #f8ece9; stroke: #d94b40; stroke-width: 2.3; }
      .node-white { fill: #ffffff; stroke: #8c9995; stroke-width: 1.8; }
      .edge { fill: none; stroke: #66766f; stroke-width: 2.2; marker-end: url(#arrow-end); }
      .edge-both { fill: none; stroke: #66766f; stroke-width: 2.2; marker-start: url(#arrow-start); marker-end: url(#arrow-end); }
      .edge-prod { fill: none; stroke: #327a63; stroke-width: 2.5; marker-start: url(#arrow-start); marker-end: url(#arrow-end); }
      .edge-fallback { fill: none; stroke: #8c9995; stroke-width: 2.2; stroke-dasharray: 7 6; marker-start: url(#arrow-start); marker-end: url(#arrow-end); }
      .edge-data { fill: none; stroke: #b6781f; stroke-width: 2.3; marker-end: url(#arrow-end); }
      .title { fill: #18212b; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #4c5962; font: 15px Arial, sans-serif; }
      .kicker { fill: #327a63; font: 700 14px "IBM Plex Mono", Consolas, monospace; }
      .group { fill: #4c5962; font: 700 14px "IBM Plex Mono", Consolas, monospace; }
      .node-title { fill: #18212b; font: 700 17px Arial, sans-serif; }
      .node-title-small { fill: #18212b; font: 700 15px Arial, sans-serif; }
      .node-title-light { fill: #ffffff; font: 700 17px Arial, sans-serif; }
      .node-copy { fill: #4c5962; font: 13px Arial, sans-serif; }
      .node-copy-light { fill: #dce6e1; font: 13px Arial, sans-serif; }
      .mono { fill: #18212b; font: 700 12px "IBM Plex Mono", Consolas, monospace; }
      .edge-label { fill: #4c5962; font: 700 11px "IBM Plex Mono", Consolas, monospace; }
      .loop-boundary { fill: none; stroke: #b6781f; stroke-width: 2; stroke-dasharray: 8 6; }
      .loop-title { fill: #8a5a18; font: 700 11px "IBM Plex Mono", Consolas, monospace; }
      .loop-label { fill: #8a5a18; font: 700 10px "IBM Plex Mono", Consolas, monospace; }
      .footnote { fill: #4c5962; font: 14px Arial, sans-serif; }
      .bullet-blue { fill: #2356d8; }
      .bullet-green { fill: #327a63; }
      .bullet-gold { fill: #b6781f; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1100"/>
  <text class="kicker" x="40" y="38">PAPERLOOM / CURRENT RESEARCH RUNTIME</text>
  <text class="title" x="40" y="74">One authorized turn, from product control to a reopenable Source Quote</text>
  <text class="subtitle" x="40" y="101">Java owns product state and corpus authority. Python owns one bounded Agent run. Redis Streams dispatches each authorized research job to a leased Worker.</text>

  <rect class="boundary-experience" x="30" y="125" width="170" height="255" rx="6"/>
  <rect class="boundary-java" x="220" y="125" width="750" height="255" rx="6"/>
  <rect class="boundary-dispatch" x="990" y="125" width="300" height="255" rx="6"/>
  <rect class="boundary-python" x="1310" y="125" width="460" height="255" rx="6"/>
  <text class="group" x="115" y="154" text-anchor="middle">EXPERIENCE</text>
  <text class="group" x="595" y="154" text-anchor="middle">JAVA / PRODUCT CONTROL</text>
  <text class="group" x="1140" y="154" text-anchor="middle">DISPATCH</text>
  <text class="group" x="1540" y="154" text-anchor="middle">HARNESS ENTRY</text>

  <rect class="node-dark" x="50" y="190" width="130" height="92" rx="5"/>
  <text class="node-title-light" x="115" y="223" text-anchor="middle">Folio</text>
  <text class="node-copy-light" x="115" y="248" text-anchor="middle">WebSocket / API</text>
  <text class="node-copy-light" x="115" y="268" text-anchor="middle">retry + source focus</text>

  <rect class="node-blue" x="245" y="180" width="180" height="112" rx="5"/>
  <text class="node-title" x="335" y="211" text-anchor="middle">ChatHandler</text>
  <text class="node-copy" x="335" y="236" text-anchor="middle">lock SourceScope</text>
  <text class="node-copy" x="335" y="257" text-anchor="middle">generation / cancel / retry</text>
  <text class="node-copy" x="335" y="278" text-anchor="middle">persist accepted output</text>

  <rect class="node-blue" x="460" y="180" width="280" height="112" rx="5"/>
  <text class="node-title" x="600" y="207" text-anchor="middle">ProductReading</text>
  <text class="node-title" x="600" y="229" text-anchor="middle">ConversationService</text>
  <text class="node-copy" x="600" y="254" text-anchor="middle">history + research / reading memory</text>
  <text class="node-copy" x="600" y="275" text-anchor="middle">historical retry snapshot</text>

  <rect class="node-blue" x="775" y="180" width="170" height="112" rx="5"/>
  <text class="node-title-small" x="860" y="210" text-anchor="middle">ResearchHarness</text>
  <text class="node-title-small" x="860" y="231" text-anchor="middle">Transport</text>
  <text class="node-copy" x="860" y="255" text-anchor="middle">request mapping</text>
  <text class="node-copy" x="860" y="276" text-anchor="middle">quota reservation</text>

  <rect class="node-green" x="1015" y="195" width="245" height="105" rx="5"/>
  <text class="mono" x="1137.5" y="222" text-anchor="middle">PRODUCTION DISPATCH</text>
  <text class="node-title-small" x="1137.5" y="248" text-anchor="middle">Redis Streams + keys</text>
  <text class="node-copy" x="1137.5" y="274" text-anchor="middle">jobs / events / status / cancel</text>

  <rect class="node-green" x="1335" y="195" width="195" height="105" rx="5"/>
  <text class="node-title-small" x="1432.5" y="225" text-anchor="middle">RedisResearchWorker</text>
  <text class="node-copy" x="1432.5" y="250" text-anchor="middle">consumer group + lease</text>
  <text class="node-copy" x="1432.5" y="274" text-anchor="middle">heartbeat + stale recovery</text>

  <rect class="node-green" x="1570" y="205" width="170" height="105" rx="5"/>
  <text class="node-title-small" x="1655" y="235" text-anchor="middle">ResearchHarness</text>
  <text class="node-title-small" x="1655" y="256" text-anchor="middle">Service</text>
  <text class="node-copy" x="1655" y="280" text-anchor="middle">validate user + scope</text>
  <text class="node-copy" x="1655" y="299" text-anchor="middle">assemble one run</text>

  <path class="edge-both" d="M 180 236 L 245 236"/>
  <path class="edge-both" d="M 425 236 L 460 236"/>
  <path class="edge-both" d="M 740 236 L 775 236"/>
  <path class="edge-prod" d="M 945 236 L 1015 236"/>
  <path class="edge-prod" d="M 1260 247.5 L 1335 247.5"/>
  <path class="edge" d="M 1530 247.5 L 1570 247.5"/>
  <text class="edge-label" x="900" y="365" text-anchor="middle">AUTHORIZED REQUEST  -&gt;    PROGRESS + TERMINAL RESULT  &lt;-</text>

  <rect class="boundary-java" x="30" y="410" width="970" height="620" rx="6"/>
  <rect class="boundary-python" x="1020" y="410" width="750" height="620" rx="6"/>
  <text class="group" x="515" y="440" text-anchor="middle">JAVA CORPUS PLANE / AUTHORITY + DURABILITY</text>
  <text class="group" x="1395" y="440" text-anchor="middle">PYTHON / REQUEST-LOCAL AGENT RUNTIME</text>
  <rect class="loop-boundary" x="1038" y="452" width="707" height="532" rx="8"/>
  <text class="loop-title" x="1391.5" y="468" text-anchor="middle">AGENT LOOP: MODEL -&gt; FUNCTION TOOL -&gt; GUARD -&gt; CORPUS TOOL -&gt; RESULT -&gt; MODEL</text>

  <rect class="node-blue" x="690" y="475" width="270" height="105" rx="5"/>
  <text class="node-title" x="825" y="506" text-anchor="middle">InternalCorpusController</text>
  <text class="node-copy" x="825" y="532" text-anchor="middle">re-check user + fixed paper scope</text>
  <text class="node-copy" x="825" y="553" text-anchor="middle">papers / locations / structure / read</text>

  <rect class="node-green" x="1050" y="475" width="270" height="105" rx="5"/>
  <text class="node-title" x="1185" y="506" text-anchor="middle">LiveResearchChatHarness</text>
  <text class="node-copy" x="1185" y="532" text-anchor="middle">RunControl + optional Eval Capture</text>
  <text class="node-copy" x="1185" y="553" text-anchor="middle">stable limited / cancelled / failed states</text>

  <rect class="node-green" x="1370" y="475" width="360" height="105" rx="5"/>
  <text class="node-title" x="1550" y="498" text-anchor="middle">AgentsSdkHarnessRuntime</text>
  <text class="node-title" x="1550" y="520" text-anchor="middle">+ Agents SDK Runner</text>
  <text class="node-copy" x="1550" y="544" text-anchor="middle">request-local Context + Agent + Session</text>
  <text class="node-copy" x="1550" y="565" text-anchor="middle">repeat model -&gt; tools -&gt; result until accepted</text>

  <path class="edge" d="M 1655 310 L 1655 395 L 1185 395 L 1185 475"/>
  <path class="edge" d="M 1320 527.5 L 1370 527.5"/>

  <rect class="node-green" x="1050" y="635" width="270" height="155" rx="5"/>
  <text class="node-title" x="1185" y="660" text-anchor="middle">Deterministic</text>
  <text class="node-title" x="1185" y="682" text-anchor="middle">Protocol Guard</text>
  <text class="node-copy" x="1185" y="708" text-anchor="middle">DIRECT | CATALOG | RESEARCH</text>
  <text class="node-copy" x="1185" y="731" text-anchor="middle">ACTIVE -&gt; REPAIR -&gt; COMPLETE</text>
  <text class="node-copy" x="1185" y="754" text-anchor="middle">validates every requested action</text>
  <text class="node-copy" x="1185" y="777" text-anchor="middle">submit_* must be the sole final call</text>

  <rect class="node-gold" x="1370" y="635" width="360" height="155" rx="5"/>
  <text class="node-title" x="1550" y="660" text-anchor="middle">ReadingCorpusTools</text>
  <text class="node-title" x="1550" y="682" text-anchor="middle">+ JavaCorpusGatewayReader</text>
  <text class="node-copy" x="1550" y="708" text-anchor="middle">paper -&gt; location -&gt; exact-read disclosure</text>
  <text class="node-copy" x="1550" y="731" text-anchor="middle">search / identity / content / structure / read</text>
  <text class="node-copy" x="1550" y="754" text-anchor="middle">owns run-local known Source Quotes</text>
  <text class="node-copy" x="1550" y="777" text-anchor="middle">no MySQL, Qdrant, or local paper index</text>

  <path class="edge-both" d="M 1550 580 L 1550 610 L 1185 610 L 1185 635"/>
  <path class="edge-both" d="M 1320 712.5 L 1370 712.5"/>
  <path class="edge-both" d="M 1550 790 L 1550 810 L 1010 810 L 1010 527.5 L 960 527.5"/>
  <text class="loop-label" x="1368" y="603" text-anchor="middle">3 REQUESTED ACTION / 5 STRUCTURED RESULT + REPEAT</text>
  <text class="loop-label" x="1345" y="699" text-anchor="middle">4 VALIDATE</text>
  <text class="loop-label" x="1345" y="735" text-anchor="middle">EXECUTE</text>
  <text class="edge-label" x="1260" y="804" text-anchor="middle">INTERNAL JAVA CORPUS API</text>

  <rect class="node-blue" x="60" y="635" width="270" height="140" rx="5"/>
  <text class="node-title" x="195" y="667" text-anchor="middle">Metadata + Structure</text>
  <text class="node-copy" x="195" y="694" text-anchor="middle">authorized paper discovery / identity</text>
  <text class="node-copy" x="195" y="717" text-anchor="middle">PAGE / SECTION navigation</text>
  <text class="node-copy" x="195" y="740" text-anchor="middle">canonical structure reads</text>

  <rect class="node-gold" x="365" y="635" width="280" height="140" rx="5"/>
  <text class="node-title" x="505" y="667" text-anchor="middle">Configured Retrieval</text>
  <text class="node-copy" x="505" y="694" text-anchor="middle">sparse-only-v1 or sparse-dense-v1</text>
  <text class="node-copy" x="505" y="717" text-anchor="middle">BM25 + optional embo-01 / weighted RRF</text>
  <text class="node-copy" x="505" y="740" text-anchor="middle">sparse fallback + bounded previews</text>

  <rect class="node-gold" x="680" y="635" width="280" height="140" rx="5"/>
  <text class="node-title" x="820" y="667" text-anchor="middle">Validated Exact Read</text>
  <text class="node-copy" x="820" y="694" text-anchor="middle">scope / model / location / hash / span</text>
  <text class="node-copy" x="820" y="717" text-anchor="middle">Qdrant payload or MySQL structure text</text>
  <text class="node-copy" x="820" y="740" text-anchor="middle">create or reuse source_quote_ref</text>

  <path class="edge" d="M 775 580 L 775 605 L 195 605 L 195 635"/>
  <path class="edge" d="M 825 580 L 825 615 L 505 615 L 505 635"/>
  <path class="edge" d="M 875 580 L 875 635"/>

  <rect class="node-white" x="60" y="835" width="400" height="140" rx="5"/>
  <text class="node-title" x="260" y="868" text-anchor="middle">MySQL / authoritative state</text>
  <text class="node-copy" x="260" y="896" text-anchor="middle">paper ACL + canonical Current Reading Model</text>
  <text class="node-copy" x="260" y="919" text-anchor="middle">PAGE / SECTION text + validation records</text>
  <text class="node-copy" x="260" y="942" text-anchor="middle">conversations + retry lineage + durable Source Quotes</text>

  <rect class="node-gold" x="520" y="835" width="400" height="140" rx="5"/>
  <text class="node-title" x="720" y="868" text-anchor="middle">Qdrant / rebuildable candidate projection</text>
  <text class="node-copy" x="720" y="896" text-anchor="middle">lexical_bm25_v1 + optional dense_embo01_v1</text>
  <text class="node-copy" x="720" y="919" text-anchor="middle">candidate previews + cached PASSAGE / TABLE / FIGURE payloads</text>
  <text class="node-copy" x="720" y="942" text-anchor="middle">a search result alone is never citeable</text>

  <path class="edge-data" d="M 195 775 L 195 835"/>
  <path class="edge-data" d="M 505 775 L 505 810 L 720 810 L 720 835"/>
  <path class="edge-data" d="M 770 775 L 770 805 L 400 805 L 400 835"/>
  <path class="edge-data" d="M 870 775 L 870 835"/>

  <rect class="node-white" x="1050" y="835" width="270" height="150" rx="5"/>
  <text class="group" x="1185" y="866" text-anchor="middle">REQUEST-LOCAL OWNERS</text>
  <circle class="bullet-green" cx="1078" cy="895" r="4"/>
  <text class="node-copy" x="1092" y="900">ProtocolState: publish contract</text>
  <circle class="bullet-gold" cx="1078" cy="922" r="4"/>
  <text class="node-copy" x="1092" y="927">CorpusState: disclosed refs</text>
  <circle class="bullet-blue" cx="1078" cy="949" r="4"/>
  <text class="node-copy" x="1092" y="954">RunControl: limits + cancel</text>
  <text class="mono" x="1185" y="976" text-anchor="middle">RELEASED AFTER THE TURN</text>

  <rect class="node-red" x="1370" y="835" width="360" height="120" rx="5"/>
  <text class="node-title" x="1550" y="861" text-anchor="middle">MiniMax-M3</text>
  <text class="node-title" x="1550" y="883" text-anchor="middle">provider_agents_model</text>
  <text class="node-copy" x="1550" y="909" text-anchor="middle">OpenAI-compatible API</text>
  <text class="node-copy" x="1550" y="932" text-anchor="middle">tool calls return to the SDK Runner</text>
  <path class="edge-both" d="M 1730 527.5 L 1750 527.5 L 1750 895 L 1730 895"/>
  <text class="loop-label" x="1763" y="711" text-anchor="middle" transform="rotate(90 1763 711)">1 MODEL REQUEST / 2 FUNCTION TOOL CALLS</text>

  <text class="footnote" x="40" y="1070">Invariant: Java fixes the paper scope; search only discloses candidates; only a Java-validated exact read returns a citeable source_quote_ref; only an accepted answer contract becomes durable product output.</text>
</svg>
