server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: paperloom
  # 基础设施连接统一从 `.env` / 环境变量读取，避免把敏感信息写死在仓库。
  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Shanghai}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/paperloom?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 与研究 harness 的 16 并发上限对齐并留余量；默认 10 会在并发落库时耗尽连接池，
      # 表现为 30s 的 "Connection is not available" 超时。
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Shanghai}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  kafka:
    enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      transactional-id-prefix: paper-upload-tx-
      properties:
        client.dns.lookup: use_all_dns_ips
    consumer:
      group-id: paper-processing-group
      auto-offset-reset: earliest
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        client.dns.lookup: use_all_dns_ips
        max.poll.interval.ms: ${SPRING_KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:7200000}
    listener:
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
    topic:
      # 文件上传完成后进入该主题，消费者会并发完成“解析 + 向量化”
      paper-processing: paper-processing-topic
      # 消费失败并重试耗尽后进入死信主题
      dlt: paper-processing-dlt
      # 分区数需要不小于 listener concurrency，才能真正并发消费
      partitions: ${SPRING_KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${SPRING_KAFKA_TOPIC_REPLICATION_FACTOR:1}
  webflux:
    client:
      max-in-memory-size: 16MB
  codec:
    max-in-memory-size: 16MB

minio:
  # MinIO 用于存储原始文件，对象 URL 会进入 Kafka 处理链路
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: ${MINIO_BUCKET_NAME:uploads}
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000}

jwt:
  # 必须是 Base64 编码字符串
  secret-key: ${JWT_SECRET_KEY:}

admin:
  bootstrap:
    # 仅用于首次引导创建管理员账号，创建成功后应关闭
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

app:
  auth:
    registration:
      # OPEN: 开放注册
      # INVITE_ONLY: 必须邀请码
      # CLOSED: 完全关闭注册
      mode: ${APP_AUTH_REGISTRATION_MODE:INVITE_ONLY}
      invite-required: ${APP_AUTH_INVITE_REQUIRED:true}
    guest:
      daily-login-attempt-limit: ${APP_AUTH_GUEST_DAILY_LOGIN_ATTEMPT_LIMIT:100}

usage-quota:
  # 用户全局 Token 余额；新用户按 init-tokens 发放，使用时按实际 Token 扣减
  retention-days: ${USAGE_QUOTA_RETENTION_DAYS:35}
  llm:
    enabled: ${USAGE_QUOTA_LLM_ENABLED:true}
    init-tokens: ${USAGE_QUOTA_LLM_INIT_TOKENS:10000000} # 新用户的初始 LLM 余额
  embedding:
    enabled: ${USAGE_QUOTA_EMBEDDING_ENABLED:true}
    init-tokens: ${USAGE_QUOTA_EMBEDDING_INIT_TOKENS:10000000} # 新用户的初始 Embedding 余额
    admin-init-tokens: ${USAGE_QUOTA_EMBEDDING_ADMIN_INIT_TOKENS:10000000} # 管理员初始 Embedding 余额

paper:
  parsing:
    provider: mineru
    buffer-size: 8192
    max-memory-threshold: 0.8
    mineru:
      base-url: ${PAPER_PARSING_MINERU_BASE_URL:https://mineru.net}
      api-token: ${PAPER_PARSING_MINERU_API_TOKEN:}
      auth-base-url: ${PAPER_PARSING_MINERU_AUTH_BASE_URL:https://sso.openxlab.org.cn/gw/uaa-be/api/v1/open}
      access-key: ${PAPER_PARSING_MINERU_ACCESS_KEY:}
      secret-key: ${PAPER_PARSING_MINERU_SECRET_KEY:}
      model-version: ${PAPER_PARSING_MINERU_MODEL_VERSION:vlm}
      enable-formula: ${PAPER_PARSING_MINERU_ENABLE_FORMULA:true}
      enable-table: ${PAPER_PARSING_MINERU_ENABLE_TABLE:true}
      timeout-seconds: ${PAPER_PARSING_MINERU_TIMEOUT_SECONDS:3600}
      poll-interval-seconds: ${PAPER_PARSING_MINERU_POLL_INTERVAL_SECONDS:3}
      max-result-in-memory-bytes: ${PAPER_PARSING_MINERU_MAX_RESULT_IN_MEMORY_BYTES:67108864}
  bootstrap:
    enabled: ${PAPER_BOOTSTRAP_ENABLED:true}
    path: ${PAPER_BOOTSTRAP_PATH:data/2412.08972.pdf}
    publish: ${PAPER_BOOTSTRAP_PUBLISH:true}
    user-id: ${PAPER_BOOTSTRAP_USER_ID:system-bootstrap}

paperloom:
  oauth2:
    # The URL that remote MCP clients use for authorization discovery and browser login.
    issuer: ${PAPERLOOM_OAUTH_ISSUER:http://127.0.0.1:8081}

research-harness:
  max-active-generations: ${RESEARCH_HARNESS_MAX_ACTIVE_GENERATIONS:16}
  user-retry-max-per-message: ${RESEARCH_HARNESS_USER_RETRY_MAX_PER_MESSAGE:3}
  base-url: ${RESEARCH_HARNESS_BASE_URL:http://127.0.0.1:8091}
  internal-token: ${RESEARCH_HARNESS_INTERNAL_TOKEN:}
  http:
    request-timeout-seconds: ${RESEARCH_HARNESS_HTTP_REQUEST_TIMEOUT_SECONDS:930}
discovery:
  runner:
    base-url: ${DISCOVERY_RUNNER_BASE_URL:http://127.0.0.1:8092}
    internal-token: ${DISCOVERY_RUNNER_INTERNAL_TOKEN:}

qdrant:
  base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
  api-key: ${QDRANT_API_KEY:}
  collection: ${QDRANT_COLLECTION:paperloom_reading_locations_hybrid_v1}
  contract: ${QDRANT_CONTRACT:sparse-only-v1}
  embedding-dimension: ${QDRANT_EMBEDDING_DIMENSION:1536}
  connect-timeout: ${QDRANT_CONNECT_TIMEOUT:5s}
  request-timeout: ${QDRANT_REQUEST_TIMEOUT:20s}
  upsert-batch-size: ${QDRANT_UPSERT_BATCH_SIZE:64}

security:
  # WebSocket 与浏览器跨域白名单，支持 Origin pattern，多个来源用逗号分隔
  allowed-origins: ${SECURITY_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.boot.autoconfigure.web.servlet: ${LOG_LEVEL_AUTOCONFIG:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    io.github.chzarles.paperloom: ${LOG_LEVEL_APP:DEBUG}
    io.minio: ${LOG_LEVEL_MINIO:DEBUG}

log4j:
  logger:
    org:
      apache:
        tika: DEBUG
